name: release

# Tag vX.Y.Z (or run manually) → unsigned IPA attached to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (blank = prerelease "build-<run number>")
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: '27.0'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Archive and package
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: bash ci/make-ipa.sh
      - name: Summarise errors
        if: failure()
        run: bash ci/xcerrors.sh build/archive.log
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixlAudio-unsigned-ipa
          path: build/PixlAudio-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"; flags=""
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="${INPUT_TAG}"; flags=""
          else
            tag="build-${GITHUB_RUN_NUMBER}"; flags="--prerelease"
          fi
          case "$tag" in *-beta*|*-rc*|*-alpha*) flags="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/PixlAudio-unsigned.ipa --clobber
          else
            gh release create "$tag" build/PixlAudio-unsigned.ipa --target "$GITHUB_SHA" \
              --title "PixlAudio $tag" --generate-notes $flags
          fi
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
