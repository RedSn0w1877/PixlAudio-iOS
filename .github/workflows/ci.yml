name: ci

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      shots:
        description: Run the screenshot job
        type: boolean
        default: true
      shots_only:
        description: "Comma-separated UI test classes to run (e.g. PlayerScreenshotTests,LyricsScreenshotTests); empty = all"
        type: string
        default: ''
      ipa:
        description: Build the unsigned IPA
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: '27.0'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
  SIM_IOS_MAJOR: '27'

# Runner time matters: only 5 macOS jobs run at once across everyone. Rules of thumb in this file:
# - the simulator's first boot (2–6 min) starts in the background right after Xcode is selected and is only
#   awaited after the build (ci/sim.sh);
# - every xcodebuild test run passes `-collect-test-diagnostics never`: otherwise xcodebuild runs
#   `simctl diagnose` after the tests, which never answers on the hosted VMs and costs a 600 s timeout per run;
# - raw xcodebuild output is kept, timestamped, in build/*.log (ci/timestamp.sh); the console shows xcbeautify.

jobs:
  core:
    # PixlCore has zero dependencies and builds on Windows, so it runs on Linux in the official Swift image:
    # no macOS runner needed.
    name: core (PixlCore swift test)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test --package-path Packages/PixlCore --parallel
      # Stage 11: search + VISIONOS-first resolution + a ranged probe + BotGuard Create against the real services.
      # Non-blocking: YouTube breaking a client must not turn the build red, but the step shows it.
      - name: YouTube live smoke (non-blocking)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PIXL_LIVE_YOUTUBE: '1'
        run: swift test --package-path Packages/PixlCore --filter YouTubeLiveSmokeTests

  app:
    name: app (build + unit tests, Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Start booting the simulator
        run: bash ci/sim.sh boot "$SIM_IOS_MAJOR"
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            2>&1 | bash ci/timestamp.sh | tee build/build.log | cut -c14- | xcbeautify --quieter
      - name: Wait for the simulator
        run: bash ci/sim.sh wait
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PixlAudioTests \
            -collect-test-diagnostics never \
            -resultBundlePath build/UnitTests.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/test.log | cut -c14- | xcbeautify --quieter
      - name: Summarise errors
        if: failure()
        run: |
          cat build/build.log build/test.log > build/all.log 2>/dev/null || true
          bash ci/xcerrors.sh build/all.log build/UnitTests.xcresult
      - name: Upload test results
        # TEMPORARY (ci-speed measurements): always; back to failure() before merging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult-${{ github.sha }}
          path: |
            build/UnitTests.xcresult
            build/*.log
          retention-days: 5
          if-no-files-found: ignore

  shots:
    name: shots (UI screenshots, light + dark)
    if: >-
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[shots]') ||
      contains(github.event.head_commit.message, '[shots:') ||
      (github.event_name == 'workflow_dispatch' && inputs.shots)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Start booting the simulator
        run: bash ci/sim.sh boot "$SIM_IOS_MAJOR"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            2>&1 | bash ci/timestamp.sh | tee build/build.log | cut -c14- | xcbeautify --quieter
      - name: Prepare the simulator
        run: |
          bash ci/sim.sh wait
          date -u +'%T status bar'
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          date -u +'%T keyboard defaults'
          # Suppress the first-run "slide to type" keyboard tip in search screenshots.
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          date -u +'%T ready'
      - name: Screenshot tests
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHOTS_ONLY_INPUT: ${{ inputs.shots_only }}
        run: |
          set -o pipefail
          # Which UI tests run: ci/ui-test-args.sh ([shots:A,B] or shots_only on branches; main runs every class;
          # opt-in classes such as TransitionPerformanceTests only when named).
          SELECTION=()
          while IFS= read -r arg; do SELECTION+=("$arg"); done < <(bash ci/ui-test-args.sh)
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            "${SELECTION[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -collect-test-diagnostics never \
            -resultBundlePath build/Shots.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/shots.log | cut -c14- | xcbeautify --quieter
          bash ci/check-ui-tests-ran.sh build/shots.log
      - name: Enumerate the every-class selection (TEMPORARY check)
        if: always()
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -skip-testing:PixlAudioTests \
            -skip-testing:PixlAudioUITests/TransitionPerformanceTests \
            -skip-testing:PixlAudioUITests/AIScreenshotTests \
            -collect-test-diagnostics never \
            -enumerate-tests -test-enumeration-style hierarchical -test-enumeration-format json \
            -test-enumeration-output-path build/enumerate-all.json \
            2>&1 | bash ci/timestamp.sh | tail -n 30
          head -c 6000 build/enumerate-all.json || true
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Shots.xcresult ]; then bash ci/export-shots.sh build/Shots.xcresult build/shots; fi
      - name: Summarise errors
        if: failure()
        run: |
          cat build/build.log build/shots.log > build/all.log 2>/dev/null || true
          bash ci/xcerrors.sh build/all.log build/Shots.xcresult
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.sha }}
          path: build/shots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload result bundle
        # TEMPORARY (ci-speed measurements): always; back to failure() before merging.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-xcresult-${{ github.sha }}
          path: |
            build/Shots.xcresult
            build/*.log
          retention-days: 5
          if-no-files-found: ignore

  ipa:
    name: ipa (unsigned archive)
    if: >-
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ipa]') ||
      (github.event_name == 'workflow_dispatch' && inputs.ipa)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Archive and package
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: bash ci/make-ipa.sh
      - name: Summarise errors
        if: failure()
        run: bash ci/xcerrors.sh build/archive.log
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PixlAudio-unsigned-ipa
          path: build/PixlAudio-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
