name: ci

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      # The RunPod worker builds on ubuntu runners in its own workflows (cloud-worker-*.yml); its changes must
      # not hold the scarce macOS runners.
      - 'cloud/**'
      - '.github/workflows/cloud-worker-*.yml'
      - '.github/workflows/cloud-e2e.yml'
  workflow_dispatch:
    inputs:
      shots:
        description: Run the screenshot tests
        type: boolean
        default: true
      shots_only:
        description: "Comma-separated UI test classes to run (e.g. PlayerScreenshotTests,LyricsScreenshotTests); empty = all"
        type: string
        default: ''
      ipa:
        description: Build the unsigned IPA
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: '27.0'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
  SIM_IOS_MAJOR: '27'

# Runner time matters: only 5 macOS jobs run at once across everyone, so a push should hold as few macOS runners
# for as short a time as possible (measurements: the ci-speed branch, runs 36899362105 → 36939967573).
# - One macOS job per push (plus ipa on main): `app` builds once, boots one simulator and runs the unit tests and,
#   when screenshots are requested, the UI screenshot tests on that same build and simulator. A separate shots job
#   cost a second build and a second simulator boot (~8 runner-minutes) for ~2 minutes less latency.
# - The simulator boots only after the build (ci/sim.sh): its first boot on these 3-CPU / 7 GB runners sets off
#   10+ minutes of widget/wallpaper rendering that made an overlapping build 3x slower. The unit tests run during
#   that storm; the screenshots come after them, so they are no longer taken on a machine that is still settling.
# - Every xcodebuild test run passes `-collect-test-diagnostics never`: otherwise xcodebuild runs `simctl diagnose`
#   after the tests, which never answers on the hosted VMs and cost a 600 s timeout per run.
# - Spotlight indexing is off on the runner (ci/tune-runner.sh); PixlCore tests run on Linux (core job).
# - Raw xcodebuild output is kept, timestamped, in build/*.log (ci/timestamp.sh); the console shows xcbeautify.

jobs:
  core:
    # PixlCore has zero dependencies and builds on Windows, so it runs on Linux in the official Swift image (all of
    # its tests pass there): no macOS runner needed.
    name: core (PixlCore swift test)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      # Cloud Studio (design §2.3): the copies PixlNet's tests decode (Fixtures/cloud/) must be byte-identical to the
      # worker's golden examples (cloud/runpod-worker/schema/v1/examples/). The worker's own workflow checks the
      # same pair from its side (cloud-worker-build › check_fixtures.py), since this workflow ignores cloud/**.
      - name: Cloud fixtures match the worker's schema examples
        run: bash ci/check-cloud-fixtures.sh
      - name: swift test
        run: swift test --package-path Packages/PixlCore --parallel
      # Stage 11: search + VISIONOS-first resolution + a ranged probe + BotGuard Create against the real services.
      # Non-blocking: YouTube breaking a client must not turn the build red, but the step shows it.
      - name: YouTube live smoke (non-blocking)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PIXL_LIVE_YOUTUBE: '1'
        run: swift test --package-path Packages/PixlCore --filter YouTubeLiveSmokeTests

  app:
    # Screenshots (UI tests, light + dark) run on main, with [shots] or [shots:Class,…] in the commit message, or from
    # a manual run (shots / shots_only inputs). The condition is spelled out twice: here for the name, below for steps.
    name: >-
      app (build + unit tests${{ (github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[shots]') ||
      contains(github.event.head_commit.message, '[shots:') ||
      (github.event_name == 'workflow_dispatch' && inputs.shots)) && ' + UI screenshots' || '' }}, Xcode 27)
    runs-on: xcode-27
    # Build + boot + unit tests take ~13 min and the full screenshot run ~95-100 min (see the Screenshot tests step):
    # 195 leaves room for both limits below.
    timeout-minutes: 195
    env:
      RUN_SHOTS: >-
        ${{ github.ref == 'refs/heads/main' ||
        contains(github.event.head_commit.message, '[shots]') ||
        contains(github.event.head_commit.message, '[shots:') ||
        (github.event_name == 'workflow_dispatch' && inputs.shots) }}
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      # After the forbidden-pattern check (which insists the committed key file is the empty stub): the
      # CLOUD_DEFAULTS_KEY secret becomes XOR shares in App/Generated/CloudDefaultsKey.swift. Without the secret
      # (forks, a repo that never set it) the stub stays and the app simply has no built-in cloud keys.
      - name: Built-in cloud keys
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
        run: bash ci/write-cloud-defaults-key.sh
      - name: Tune the runner
        run: bash ci/tune-runner.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Pick simulator
        run: bash ci/pick-sim.sh "$SIM_IOS_MAJOR"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Build for testing
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            2>&1 | bash ci/timestamp.sh | tee build/build.log | cut -c14- | xcbeautify --quieter
      - name: Boot the simulator
        id: boot
        timeout-minutes: 15
        run: bash ci/sim.sh boot
      - name: Unit tests
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PixlAudioTests \
            -collect-test-diagnostics never \
            -resultBundlePath build/UnitTests.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/test.log | cut -c14- | xcbeautify --quieter
      # Screenshots still run when a unit test failed (the same signal two separate jobs gave), not after a failed
      # build or boot.
      - name: Prepare the simulator for screenshots
        id: prepare
        if: ${{ !cancelled() && env.RUN_SHOTS == 'true' && steps.boot.outcome == 'success' }}
        run: bash ci/sim.sh prepare-shots
      # A full run (main) costs ~20 s per UI test, ~13 s of it launching the app (automation session + idle wait):
      # 202 tests took 55 min (run 36941876010); 276 tests took 100 min (run 37679882164, 2026-10-07: 93 min of
      # passes plus 12 retried failures), which hit the old 100-minute limit just as the tests finished, so nothing
      # was exported. 160 min leaves ~60 % headroom for the batch's new classes and for retries; branch runs
      # ([shots:Class,...]) take a few minutes and are unaffected. Raise this limit, and the job's, as classes are
      # added (per-class times: grep "Test Case .* passed" in build/shots.log of a main run).
      - name: Screenshot tests
        if: ${{ !cancelled() && env.RUN_SHOTS == 'true' && steps.prepare.outcome == 'success' }}
        timeout-minutes: 160
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHOTS_ONLY_INPUT: ${{ inputs.shots_only }}
        run: |
          set -o pipefail
          # Which UI tests run: ci/ui-test-args.sh ([shots:A,B] or shots_only on branches; main runs every class;
          # opt-in classes such as TransitionPerformanceTests only when named).
          SELECTION=()
          while IFS= read -r arg; do SELECTION+=("$arg"); done < <(bash ci/ui-test-args.sh)
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            "${SELECTION[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -collect-test-diagnostics never \
            -resultBundlePath build/Shots.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/shots.log | cut -c14- | xcbeautify --quieter
          bash ci/check-ui-tests-ran.sh build/shots.log
      # "[record:Class]" in the commit message films one UI test class on the simulator (simctl io recordVideo), so
      # animations can be checked frame by frame (e.g. the system menu morph against a device recording). The video
      # and that class's screenshots (build/record) go into the shots artifact.
      - name: Record UI video
        id: record
        if: ${{ !cancelled() && env.RUN_SHOTS == 'true' && steps.prepare.outcome == 'success' && contains(github.event.head_commit.message, '[record:') }}
        timeout-minutes: 20
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          CLASS="$(printf '%s' "$COMMIT_MSG" | grep -oE '\[record:[A-Za-z0-9_]+\]' | head -1 | sed -E 's/^\[record:([A-Za-z0-9_]+)\]$/\1/' || true)"
          if [ -z "$CLASS" ]; then echo "no valid [record:Class]"; exit 0; fi
          mkdir -p build/record
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "build/record/record-$CLASS.mp4" &
          REC=$!
          sleep 3
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            "-only-testing:PixlAudioUITests/$CLASS" \
            -collect-test-diagnostics never \
            -resultBundlePath build/Record.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/record.log | cut -c14- | xcbeautify --quieter || true
          kill -INT "$REC" || true
          wait "$REC" || true
          ls -la "build/record/record-$CLASS.mp4" || true
          if [ -d build/Record.xcresult ]; then bash ci/export-shots.sh build/Record.xcresult build/record/shots; fi
      # "[perf]" in the commit message runs TransitionPerformanceTests on an optimised app. The runs above use the Debug
      # build (-Onone, a debug dylib), whose CPU numbers say little about the shipped app. This builds the
      # PixlAudioPerf scheme (UI tests only, Release) next to it and runs them on the same simulator. It never turns
      # the job red (continue-on-error); its numbers go to the job summary and the perf-<sha> artifact.
      - name: Performance tests (Release build, [perf])
        id: perf
        if: ${{ !cancelled() && steps.boot.outcome == 'success' && contains(github.event.head_commit.message, '[perf]') }}
        continue-on-error: true
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p build/perf
          xcodebuild build-for-testing \
            -project PixlAudio.xcodeproj -scheme PixlAudioPerf \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData-perf \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | bash ci/timestamp.sh | tee build/perf-build.log | cut -c14- | xcbeautify --quieter
          # Earlier steps ran the Debug app as this simulator's host: the Release one starts from a fresh data container.
          app="build/DerivedData-perf/Build/Products/Release-iphonesimulator/PixlAudio.app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl terminate "$SIM_UDID" "$bundle_id" 2>/dev/null || true
          xcrun simctl uninstall "$SIM_UDID" "$bundle_id" || true
          xcrun simctl keychain "$SIM_UDID" reset || true
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudioPerf \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData-perf \
            -only-testing:PixlAudioUITests/TransitionPerformanceTests \
            -collect-test-diagnostics never \
            -resultBundlePath build/Perf.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/perf.log | cut -c14- | xcbeautify --quieter
      - name: Performance metrics (Release build)
        if: ${{ always() && contains(github.event.head_commit.message, '[perf]') }}
        run: |
          mkdir -p build/perf
          if [ -f build/perf.log ] && grep -q 'measured \[' build/perf.log; then
            grep 'measured \[' build/perf.log \
              | sed -E "s/^.*Test Case '-\[PixlAudioUITests\.([A-Za-z]+) ([A-Za-z0-9_]+)\]' measured /\1.\2 /; s/, performanceMetricID.*//" \
              > build/perf/perf-metrics-release.txt
            { echo "### Performance metrics (Release build)"; echo '```'; cat build/perf/perf-metrics-release.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload performance results
        if: ${{ always() && contains(github.event.head_commit.message, '[perf]') }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: |
            build/perf
            build/perf.log
            build/perf-build.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Export screenshots
        if: ${{ always() && env.RUN_SHOTS == 'true' }}
        run: |
          if [ -d build/Shots.xcresult ]; then bash ci/export-shots.sh build/Shots.xcresult build/shots; fi
      - name: Performance metrics
        if: ${{ always() && env.RUN_SHOTS == 'true' }}
        run: |
          # Performance tests (TransitionPerformanceTests) print "measured [<metric>] average: …" lines; keep them
          # with the screenshots and in the job summary.
          mkdir -p build/shots
          if [ -f build/shots.log ] && grep -q 'measured \[' build/shots.log; then
            grep 'measured \[' build/shots.log \
              | sed -E "s/^.*Test Case '-\[PixlAudioUITests\.([A-Za-z]+) ([A-Za-z0-9_]+)\]' measured /\1.\2 /; s/, performanceMetricID.*//" \
              > build/shots/perf-metrics.txt
            { echo "### Performance metrics"; echo '```'; cat build/shots/perf-metrics.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summarise errors
        if: failure()
        run: |
          cat build/build.log build/test.log build/shots.log > build/all.log 2>/dev/null || true
          bash ci/xcerrors.sh build/all.log build/UnitTests.xcresult build/Shots.xcresult
      - name: Upload screenshots
        if: ${{ always() && env.RUN_SHOTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.sha }}
          path: |
            build/shots
            build/record
          retention-days: 14
          if-no-files-found: warn
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult-${{ github.sha }}
          path: |
            build/UnitTests.xcresult
            build/build.log
            build/test.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload screenshot result bundle
        if: ${{ failure() && env.RUN_SHOTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: shots-xcresult-${{ github.sha }}
          path: |
            build/Shots.xcresult
            build/shots.log
          retention-days: 7
          if-no-files-found: ignore

  ipa:
    name: ipa (unsigned archive)
    if: >-
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ipa]') ||
      (github.event_name == 'workflow_dispatch' && inputs.ipa)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      # After the forbidden-pattern check (which insists the committed key file is the empty stub): the
      # CLOUD_DEFAULTS_KEY secret becomes XOR shares in App/Generated/CloudDefaultsKey.swift. Without the secret
      # (forks, a repo that never set it) the stub stays and the app simply has no built-in cloud keys.
      - name: Built-in cloud keys
        env:
          CLOUD_DEFAULTS_KEY: ${{ secrets.CLOUD_DEFAULTS_KEY }}
        run: bash ci/write-cloud-defaults-key.sh
      - name: Tune the runner
        run: bash ci/tune-runner.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Archive and package
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: bash ci/make-ipa.sh
      - name: Summarise errors
        if: failure()
        run: bash ci/xcerrors.sh build/archive.log
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PixlAudio-unsigned-ipa
          path: build/PixlAudio-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
