name: ml-convert

# Manual, build-time only: converts the on-device ML models to Core ML and publishes them as assets of the GitHub
# Release `models-v1` (a prerelease, so the app's update check never sees it). The app downloads them on demand
# (App/Services/ML/ModelManager.swift) and pins each tar's SHA-256 in App/Services/ML/ModelCatalog.swift — so an
# existing asset is only replaced when `replace` is ticked, and the catalog must be updated in the same change.
#
#   wav2vec2 — facebook/wav2vec2-base-960h (Android's TAIS lyric-sync model), fp16 ML Program, fixed 10 s windows,
#              gated against PyTorch (ci/ml/convert_wav2vec2.py). Required.
#   mdx      — ATTEMPT: UVR-MDX-NET-Voc_FT (Android's on-device instrumental model) via ONNX -> PyTorch -> Core ML,
#              gated against ONNX Runtime (ci/ml/convert_mdx.py). Allowed to fail; its report says why.
#   llm      — the downloadable local AI model (Settings › AI features › "Use downloaded AI model"): a Qwen2.5
#              instruct model (Apache-2.0) as a stateful ML Program (MLState KV cache), int4 per block of 32, plus our
#              tokenizer file (ci/ml/convert_llm.py). Converted on Linux (16 GB RAM), gated on macOS against the
#              transformers reference. Never part of `all` (it is large and slow).
on:
  workflow_dispatch:
    inputs:
      models:
        description: Which models to convert
        type: choice
        options: [all, wav2vec2, mdx, llm]
        default: all
      llm_model:
        description: Which local AI model (llm only)
        type: choice
        options: [qwen2.5-1.5b, qwen2.5-0.5b]
        default: qwen2.5-1.5b
      dry_run:
        description: Convert and check only; publish nothing
        type: boolean
        default: false
      replace:
        description: Replace assets that already exist on models-v1 (update ModelCatalog.swift's pins too!)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ml-convert
  cancel-in-progress: false

env:
  RELEASE_TAG: models-v1
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  wav2vec2:
    if: inputs.models == 'all' || inputs.models == 'wav2vec2'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r ci/ml/requirements.txt
          pip freeze | grep -iE 'torch|coreml|transformers|numpy'
      - name: Convert + parity gate
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          . .venv/bin/activate
          python ci/ml/convert_wav2vec2.py --out out
      - name: Report
        if: always()
        run: |
          if [ -f out/wav2vec2-report.json ]; then
            echo '### wav2vec2 conversion' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/wav2vec2-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-wav2vec2
          path: |
            out/wav2vec2-report.json
            out/*.tar
          retention-days: 7
          if-no-files-found: warn

  mdx:
    if: inputs.models == 'all' || inputs.models == 'mdx'
    runs-on: macos-26
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r ci/ml/requirements.txt
      - name: Convert + parity gate (attempt)
        run: |
          . .venv/bin/activate
          python ci/ml/convert_mdx.py --out out
      - name: Report
        if: always()
        run: |
          if [ -f out/mdx-report.json ]; then
            echo '### MDX-Net conversion (attempt)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat out/mdx-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-mdx
          path: |
            out/mdx-report.json
            out/*.tar
          retention-days: 7
          if-no-files-found: warn

  llm_convert:
    if: inputs.models == 'llm'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: Room to work (disk and swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/llm.swap && sudo chmod 600 /mnt/llm.swap && sudo mkswap /mnt/llm.swap && sudo swapon /mnt/llm.swap
          free -g
          df -h / /mnt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.0
          pip install -r ci/ml/requirements-llm.txt
          pip freeze | grep -iE 'torch|coreml|transformers|numpy|tokenizers|safetensors'
      - name: Convert (reference, module check, Core ML candidates, tokenizer, tiny model)
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HOME: /mnt/hf
        run: |
          . .venv/bin/activate
          sudo mkdir -p /mnt/hf /mnt/candidates && sudo chown "$USER" /mnt/hf /mnt/candidates
          python ci/ml/convert_llm.py convert --model "${{ inputs.llm_model }}" --out /mnt/candidates
          rm -rf /mnt/hf
          du -sh /mnt/candidates/*
      - name: Report
        if: always()
        run: |
          if [ -f /mnt/candidates/llm-convert-report.json ]; then
            echo '### Local AI model conversion' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import json; d=json.load(open('/mnt/candidates/llm-convert-report.json')); print(json.dumps({k: v for k, v in d.items() if k != 'tiny'}, indent=1))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: llm-candidates
          path: /mnt/candidates
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  llm_parity:
    needs: llm_convert
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python environment
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install numpy==1.26.4 coremltools==8.3.0
      - uses: actions/download-artifact@v4
        with:
          name: llm-candidates
          path: candidates
      - name: Core ML parity gate + package
        run: |
          . .venv/bin/activate
          sw_vers
          expected="$(shasum -a 256 Packages/PixlCore/Tests/PixlNetTests/Fixtures/LocalLLM/qwen2_5.pxbpe | cut -d' ' -f1)"
          python ci/ml/convert_llm.py parity --model "${{ inputs.llm_model }}" --candidates candidates --out out \
            --expect-tokenizer-sha "$expected"
      - name: Tokenizer fixtures still match the real tokenizer
        if: always()
        run: |
          # PixlCore's tokenizer tests use fixtures made with a newer `tokenizers` than this run's; both must agree.
          python3 - <<'EOF'
          import json
          repo = json.load(open("Packages/PixlCore/Tests/PixlNetTests/Fixtures/LocalLLM/tokenizer-cases.json"))
          run = json.load(open("candidates/tokenizer-cases.json"))
          a = {c["text"]: c["ids"] for c in repo["cases"]}
          b = {c["text"]: c["ids"] for c in run["cases"]}
          diff = [t for t in a if t in b and a[t] != b[t]]
          missing = [t for t in a if t not in b]
          chat = (repo.get("chat") or {}).get("ids") == (run.get("chat") or {}).get("ids")
          print(f"{len(a)} cases, {len(diff)} differ, {len(missing)} missing, chat identical: {chat}")
          for t in diff:
              print(f"::warning::tokenizer fixture differs for {t!r}")
          if not chat:
              print("::warning::the chat-template fixture differs")
          EOF
      - name: Report
        if: always()
        run: |
          if [ -f out/llm-report.json ]; then
            echo '### Local AI model parity (Core ML vs transformers fp32)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 -c "import json; d=json.load(open('out/llm-report.json')); [u.pop('per_prompt', None) for a in d.get('attempts', []) for u in a['units'].values()]; print(json.dumps(d, indent=1))" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-llm
          path: |
            out/llm-report.json
            out/qwen2_5_*.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-fixtures
          path: |
            out/tiny_qwen.mlpackage.tar
            out/tiny-expected.json
            candidates/tokenizer-cases.json
            candidates/qwen2_5.pxbpe
            candidates/llm-reference.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: [wav2vec2, mdx, llm_parity]
    if: >-
      always() && !inputs.dry_run &&
      (needs.wav2vec2.result == 'success' || needs.mdx.result == 'success' || needs.llm_parity.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-*
          path: dist
          merge-multiple: true
      - name: Publish to the models-v1 release
        env:
          GH_TOKEN: ${{ github.token }}
          # The app pins every asset's SHA-256 (ModelCatalog.swift): never replace one unless asked.
          REPLACE: ${{ inputs.replace && 'true' || 'false' }}
        run: |
          set -euo pipefail
          ls -la dist
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "On-device models v1" \
              --notes "Core ML models for PixlAudio's on-device features, downloaded by the app on demand. Built by .github/workflows/ml-convert.yml; see models-v1.json for checksums and parity results."
          fi
          mkdir -p previous
          gh release download "$RELEASE_TAG" -p models-v1.json -D previous 2>/dev/null || true
          existing="$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name')"
          kept=""
          for f in dist/*.tar; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            if printf '%s\n' "$existing" | grep -qx "$name" && [ "$REPLACE" != "true" ]; then
              echo "::warning::$name already on $RELEASE_TAG — kept (tick 'replace' to overwrite, then update ModelCatalog.swift)"
              kept="$kept $name"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done
          # Kept assets keep their previous manifest entry, so the manifest always describes what is published.
          python3 ci/ml/manifest.py dist dist/models-v1.json --previous previous/models-v1.json --kept $kept
          gh release upload "$RELEASE_TAG" dist/models-v1.json dist/*-report.json --clobber
          echo '### models-v1 manifest' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dist/models-v1.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
