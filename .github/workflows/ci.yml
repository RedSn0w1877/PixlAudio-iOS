name: ci

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      shots:
        description: Run the screenshot job
        type: boolean
        default: true
      shots_only:
        description: "Comma-separated UI test classes to run (e.g. PlayerScreenshotTests,LyricsScreenshotTests); empty = all"
        type: string
        default: ''
      ipa:
        description: Build the unsigned IPA
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XCODE_VERSION: '27.0'
  XCODEGEN_VERSION: '2.46.0'
  XCODEGEN_SHA256: '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
  SIM_IOS_MAJOR: '27'

jobs:
  core:
    name: core (PixlCore swift test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --package-path Packages/PixlCore --parallel
      # Stage 11: search + VISIONOS-first resolution + a ranged probe + BotGuard Create against the real services.
      # Non-blocking: YouTube breaking a client must not turn the build red, but the step shows it.
      - name: YouTube live smoke (non-blocking)
        continue-on-error: true
        timeout-minutes: 5
        env:
          PIXL_LIVE_YOUTUBE: '1'
        run: swift test --package-path Packages/PixlCore --filter YouTubeLiveSmokeTests

  app:
    name: app (build + unit tests, Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Pick simulator
        run: bash ci/pick-sim.sh "$SIM_IOS_MAJOR"
      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            2>&1 | tee build/build.log | xcbeautify --quieter
      - name: xcodebuild options (diagnostics)
        run: |
          mkdir -p build/diag
          xcodebuild -help > build/diag/xcodebuild-help.txt 2>&1 || true
          man xcodebuild 2>/dev/null | col -b > build/diag/xcodebuild-man.txt || true
          grep -nEi 'test|timeout|diagnos|result|parallel|relaunch|clone|destination' build/diag/xcodebuild-help.txt | head -150 || true
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize || true
      - name: Unit tests
        run: |
          set -o pipefail
          bash ci/diag-sampler.sh build/test.log build/diag >/dev/null 2>&1 &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT
          xcodebuild test-without-building \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            -only-testing:PixlAudioTests \
            -resultBundlePath build/UnitTests.xcresult \
            -verbose \
            2>&1 | bash ci/timestamp.sh | tee build/test.log
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p build/diag
          if [ -d build/UnitTests.xcresult ]; then
            xcrun xcresulttool get log --path build/UnitTests.xcresult --type action > build/diag/action-log.json 2>&1 || true
            xcrun xcresulttool get log --path build/UnitTests.xcresult --type console > build/diag/console-log.json 2>&1 || true
            xcrun xcresulttool get test-results summary --path build/UnitTests.xcresult > build/diag/summary.json 2>&1 || true
            du -sh build/UnitTests.xcresult; find build/UnitTests.xcresult -maxdepth 3 | head -50
          fi
          xcrun simctl spawn "$SIM_UDID" log show --last 25m --style compact \
            --predicate 'process == "PixlAudio" OR process == "testmanagerd" OR process CONTAINS "xctest" OR process == "SpringBoard"' \
            2>&1 | tail -c 30000000 > build/diag/sim-log.txt || true
          ls -la build/diag
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-unit-${{ github.sha }}
          path: |
            build/UnitTests.xcresult
            build/*.log
            build/diag
          retention-days: 5
          if-no-files-found: ignore
      - name: Summarise errors
        if: failure()
        run: |
          cat build/build.log build/test.log > build/all.log 2>/dev/null || true
          bash ci/xcerrors.sh build/all.log build/UnitTests.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-xcresult-${{ github.sha }}
          path: |
            build/UnitTests.xcresult
            build/*.log
          retention-days: 5
          if-no-files-found: ignore

  shots:
    name: shots (UI screenshots, light + dark)
    if: >-
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[shots]') ||
      contains(github.event.head_commit.message, '[shots:') ||
      (github.event_name == 'workflow_dispatch' && inputs.shots)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Pick and boot simulator
        run: |
          # pick-sim.sh exports SIM_UDID for later steps; this step needs it now.
          SIM_UDID="$(bash ci/pick-sim.sh "$SIM_IOS_MAJOR")"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100
          # Suppress the first-run "slide to type" keyboard tip in search screenshots.
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
      - name: Screenshot tests
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          SHOTS_ONLY_INPUT: ${{ inputs.shots_only }}
        run: |
          set -o pipefail
          mkdir -p build
          # Which UI test classes to run: the shots_only dispatch input, or "[shots:A,B]" in the commit message;
          # otherwise every class (main always runs all of them).
          FILTER="$SHOTS_ONLY_INPUT"
          if [ -z "$FILTER" ]; then
            FILTER="$(printf '%s' "$COMMIT_MSG" | grep -o '\[shots:[^]]*\]' | head -1 | sed 's/^\[shots://; s/\]$//' || true)"
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then FILTER=""; fi
          ONLY=()
          if [ -n "$FILTER" ]; then
            IFS=',' read -ra CLASSES <<< "$FILTER"
            for c in "${CLASSES[@]}"; do
              c="$(echo "$c" | tr -d '[:space:]')"
              if [[ "$c" =~ ^[A-Za-z0-9_]+$ ]]; then ONLY+=("-only-testing:PixlAudioUITests/$c"); fi
            done
          fi
          if [ ${#ONLY[@]} -eq 0 ]; then ONLY=("-only-testing:PixlAudioUITests"); fi
          echo "Running UI tests: ${ONLY[*]}"
          xcodebuild test \
            -project PixlAudio.xcodeproj -scheme PixlAudio \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/DerivedData \
            "${ONLY[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath build/Shots.xcresult \
            2>&1 | bash ci/timestamp.sh | tee build/shots.log | xcbeautify
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/Shots.xcresult ]; then bash ci/export-shots.sh build/Shots.xcresult build/shots; fi
      - name: Summarise errors
        if: failure()
        run: bash ci/xcerrors.sh build/shots.log build/Shots.xcresult
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ github.sha }}
          path: build/shots
          retention-days: 14
          if-no-files-found: warn
      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-xcresult-${{ github.sha }}
          path: |
            build/Shots.xcresult
            build/shots.log
          retention-days: 5
          if-no-files-found: ignore

  ipa:
    name: ipa (unsigned archive)
    if: >-
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[ipa]') ||
      (github.event_name == 'workflow_dispatch' && inputs.ipa)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden patterns
        run: bash ci/check-forbidden.sh
      - name: Select Xcode
        run: bash ci/select-xcode.sh "$XCODE_VERSION"
      - name: Install XcodeGen
        run: bash ci/install-xcodegen.sh "$XCODEGEN_VERSION"
      - name: Generate project
        run: xcodegen generate
      - name: Archive and package
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: bash ci/make-ipa.sh
      - name: Summarise errors
        if: failure()
        run: bash ci/xcerrors.sh build/archive.log
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PixlAudio-unsigned-ipa
          path: build/PixlAudio-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
